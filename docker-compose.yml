services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: siit
      POSTGRES_USER: siit
      POSTGRES_PASSWORD: siit
    ports:
      - "5432:5432"
    volumes:
      - siit_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://siit:siit@db:5432/siit
      JWT_SECRET_KEY: cambia-esto-por-un-secreto-real
      CURRENT_PERIODO: Enero – Junio 2026
      CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  siit_pgdata:
